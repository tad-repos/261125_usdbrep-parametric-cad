name: Deploy app to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Check syntax
        run: for file in *.js scripts/*.mjs; do node --check "$file" || exit 1; done
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed release
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const expected=JSON.parse(readFileSync('build/release.json','utf8'));
          const base=process.env.PAGES_URL.replace(/\/?$/,'/');
          for(let i=0;i<20;i++){try{const q='?v='+expected.commit;const r=await fetch(base+'release.json'+q,{cache:'no-store'});const h=await fetch(base+q,{cache:'no-store'});const actual=await r.json();if(r.ok&&h.ok&&actual.commit===expected.commit&&actual.version===expected.version&&(await h.text()).includes(expected.commit))process.exit(0);}catch{}await new Promise(r=>setTimeout(r,5000));}
          throw new Error('Published release metadata mismatch');
          JS
