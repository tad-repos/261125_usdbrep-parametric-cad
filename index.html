<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USD BRep Parametric CAD</title><link rel="stylesheet" href="./style.css"><script>(()=>{let t;try{t=localStorage.getItem('app-theme')}catch{}document.documentElement.dataset.theme=t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')})();</script><link rel="stylesheet" href="./theme.css"><link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#222222"></head>
<body><header><strong>USD BRep Parametric CAD</strong><div id="name">untitled.js</div><button id="commands" title="Ctrl/⌘ + K">Commands <kbd>⌘ K</kbd></button></header>
<div id="status" role="status" aria-live="polite">Loading SMLib WASM…</div>
<main><section class="source"><div class="bar"><button id="jsTab" aria-pressed="true">JavaScript</button><button id="usdTab" aria-pressed="false">USDA</button><span class="grow"></span><button id="stop" title="Terminate worker">Stop</button><button id="run">Run</button></div><div id="editor"></div><pre id="usda" hidden></pre><details id="logPanel" open><summary>ENGINE OUTPUT</summary><div class="log-actions"><button id="copyLog">Copy</button><button id="clearLog">Clear</button></div><pre id="engineLog" aria-label="Engine output"></pre></details><div class="foot">Trusted local JavaScript · defaultParams exposes controls</div></section>
<section class="right"><div class="bar"><span>VIEWPORT</span><span class="grow"></span><select id="quality" aria-label="Preview quality" title="Changes preview tessellation only"><option value="auto" selected>Auto</option><option value="draft">Draft</option><option value="standard">Standard</option><option value="high">High</option><option value="ultra">Ultra</option></select><select id="mode" aria-label="Display mode"><option value="edges">Shaded + edges</option><option value="shaded" selected>Shaded</option><option value="wire">Wireframe</option></select><button id="fit">Fit</button></div><div id="viewport"><canvas id="canvas"></canvas><span class="overlay">Z ↑ · Orbit / pan / zoom</span></div><div class="bar">PARAMETERS</div><div id="params" class="params"></div><div id="stats" class="foot">No model yet</div><div class="bar"><label><input type="checkbox" id="mesh"> Include preview mesh in USDA</label><span class="grow"></span><button id="export" disabled>Export USDA</button></div></section></main>
<dialog id="palette"><input id="search" placeholder="Search commands…" autocomplete="off"><div id="items"></div></dialog><input type="file" id="open" accept=".js,text/javascript" hidden><script type="module" src="./app.js"></script><button type="button" class="app-theme-toggle" id="app-theme-toggle" aria-label="Toggle light/dark theme">◐</button><span class="release-id" title="__RELEASE_SHA__">__RELEASE_LABEL__</span><script type="module" src="./shell.js"></script></body></html>
